name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # VADD_E2E is unset, so the real-adapter tests stay skipped: CI has no
      # Claude Code credentials and must not need any.
      - run: pnpm test
      # The packaged binary is the only thing users install. Bundling is the
      # one check that catches bundle-only failures (CSS imports, browser-hostile
      # barrels, an unresolvable workspace import) that the unit suite cannot.
      - run: pnpm --filter @vadd/cli build
      # Report-only: the gate currently fails by design (evidence precision
      # 75.0% against a 90% bar — see CLAUDE.md), and closing that gap is
      # human relabeling work, not something a PR's diff can fix. A blocking
      # step here would make every PR red for a reason unrelated to its own
      # change. `continue-on-error` keeps the score visible without that.
      # Revisit once the gate clears (docs/superpowers/notes/m1-post-exit-cleanup.md §1).
      - run: pnpm eval
        continue-on-error: true
